<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
  <div th:replace="components/layout/header :: head(~{::title}, ~{}, ~{})">
    <title th:text="${vo.article.title + ' - 技术派'}">技术派</title>
  </div>

  <link rel="stylesheet" href="/css/views/article-detail.css" th:href="${global.siteInfo.oss + '/css/views/article-detail.css'}" />
  <script src="/js/biz/selection.js" th:src="${global.siteInfo.oss + '/js/biz/selection.js'}"></script>
  <script src="/js/biz/highlightcomment.js" th:src="${global.siteInfo.oss + '/js/biz/highlightcomment.js'}"></script>
  <script src="/js/biz/ai-comment.js" th:src="${global.siteInfo.oss + '/js/biz/ai-comment.js'}"></script>
  <script src="/js/biz/comment-markdown.js" th:src="${global.siteInfo.oss + '/js/biz/comment-markdown.js'}"></script>

  <body id="body" class="bg-color">
    <!-- 导航栏 -->
    <div th:replace="components/layout/navbar :: navbar"></div>

    <div class="home article-detail">
      <div class="col-body pg-2-article">
        <div class="com-3-layout">
          <div class="layout-main">
            <!-- 左边点赞、收藏、评论浮窗 -->
            <div
              th:replace="views/article-detail/side-float-action-bar/index :: tool_bar(${vo.article})"
            ></div>

            <!-- 正文 -->
            <div
              th:replace="components/article/article-detail :: article_info(${vo.article}, ${vo.author}, ${vo.other}, ${vo.payUsers})"
            ></div>

            <!--  评论  -->
            <div id="commentDiv">
              <div th:replace="views/article-detail/comment/index"></div>
            </div>

            <div
              class="correlation-article bg-color-white"
              id="relatedRecommend"
            >
              <!-- 关联推荐 -->
              <h4 class="correlation-article-title">相关推荐</h4>
              <div class="bg-color-white">
                <div id="articleList"></div>
              </div>
            </div>
          </div>

          <div class="layout-side">
            <!-- 用户相关信息 -->
            <div
              th:replace="components/user/user-card :: user_card(${vo.author}, ${vo.article.author}, ${global.isLogin})"
            ></div>

            <!-- 活动推荐 -->
            <div th:if="${!#lists.isEmpty(vo.sideBarItems)}">
              <div th:replace="views/article-detail/side-recommend-bar/index">
                侧边通知板块
              </div>
            </div>
            <div id="toc-container-position"></div>
            <!-- 文章目录  -->
            <div class="right-container toc-container">
              <div class="widget">
                <h3 class="com-nav-bar-title">目录</h3>
                <div id="contentMenu" class="toc"></div>
              </div>
            </div>

            <!-- 引用评论侧边栏 -->
            <div id="quoteCommentSidebar" class="right-container quote-comment-sidebar" style="display: none;">
              <div class="widget highlight-comment-thread">
                <div class="highlight-comment-thread__head">
                  <div class="highlight-comment-thread__head-main">
                    <h3 class="com-nav-bar-title">划线评论</h3>
                    <p class="highlight-comment-thread__desc">围绕这段划线内容的讨论</p>
                  </div>
                  <button type="button" class="highlight-comment-thread__close" aria-label="关闭划线评论">×</button>
                </div>
                <div class="quote-content">
                  <div class="highlight-comment-thread__quote-label">划线片段</div>
                  <div class="quote-text" id="quotedText"></div>
                  <div class="quote-comment-form comment-input-container">
                    <textarea id="quoteCommentInput" placeholder="写下您的评论..." class="form-control"></textarea>

                    <div class="comment-toolbar">
                      <div class="toolbar-left">
                        <div class="ai-bot-selector" id="sideAiBotSelector">
                          <button type="button" class="ai-bot-btn" id="sideAiBotBtn">
                            🤖
                          </button>
                          <div class="ai-bot-dropdown" id="sideAiBotDropdown" style="top: 100%; bottom: auto;">
                            <div class="ai-bot-option" data-bot="hater">杠精派</div>
                            <div class="ai-bot-option" data-bot="smart">派聪明</div>
                          </div>
                        </div>
                      </div>
                      <div class="toolbar-right">
                        <span class="comment-count"><span id="sideCommentCount">0</span>/512</span>
                        <button id="submitQuoteComment" class="c-btn c-btn-primary mt-2" disabled>提交评论</button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 底部信息 -->
      <div th:replace="components/layout/footer :: footer"></div>
    </div>

    <!-- 左边点赞、收藏、评论浮窗 -->
    <div
      th:replace="views/article-detail/side-float-action-bar-md/index :: tool_bar(${vo.article})"
    ></div>

    <div class="modal fade" id="shareModal" tabindex="-1" role="dialog">
      <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">分享文章</h5>
            <button type="button" class="close" data-dismiss="modal">
              <span>&times;</span>
            </button>
          </div>
          <div class="modal-body text-center">
            <div class="qrcode-container mb-3">
              <img id="shareQrCode" src="" alt="分享二维码" style="width:200px;height:200px;">
            </div>
            <div class="short-url-container">
              <div class="input-group">
                <input type="text" id="shortUrl" class="form-control" readonly style="font-size: 1rem;">
                <div class="input-group-append">
                  <button class="btn btn-outline-secondary" type="button" onclick="copyAndClose()">复制</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 引用评论弹窗 (移动端) -->
    <div class="modal fade" id="quoteCommentModal" tabindex="-1" role="dialog">
      <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">引用评论</h5>
            <button type="button" class="close" data-dismiss="modal">
              <span>&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <div class="quote-content">
              <div class="quote-text" id="quotedTextModal"></div>
              <div class="quote-comment-form">
                <textarea id="quoteCommentInputModal" placeholder="写下您的评论..." class="form-control"></textarea>
                <button id="submitQuoteCommentModal" class="c-btn c-btn-primary mt-2" disabled>提交评论</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script th:inline="javascript">
      /*<![CDATA[*/
      // 内容渲染
      const articleId = [[${vo.article.articleId}]];
      let commented = [[${vo.article.commented}]]
      let commentCount = [[${vo.article.count.commentCount}]]

      function syncCommentFloatBtn() {
        const commentFloatBtn = $("#commentFloatBtn, #commentFloatBtnMd")
        if (!commentFloatBtn.length) {
          return
        }

        commentFloatBtn.toggleClass("active", !!commented)

        if (commentCount > 0) {
          commentFloatBtn.addClass("with-badge")
          commentFloatBtn.attr("badge", commentCount)
        } else {
          commentFloatBtn.removeClass("with-badge")
          commentFloatBtn.removeAttr("badge")
        }
      }

      // 生成菜单
      genTocMenu('#articleContent', '#contentMenu');

      // 跳转到评论的地方
      $("#commentFloatBtn,#commentFloatBtnMd").click(function () {
          document.getElementById("commentList").scrollIntoView(true);
      })
      syncCommentFloatBtn();

      if (window.location.href.indexOf("#commentList") >= 0) {
          document.getElementById("commentList").scrollIntoView(true);
      }

      // 点赞
      let praisedCount = [[${vo.article.count.praiseCount}]]
      let praised = [[${vo.article.praised}]]
      const isLogin = [[${global.isLogin}]]
      const currentUserId = isLogin ? [[${global.user != null ? global.user.userId: ''}]] : '';
      const currentUserAvatar = isLogin ? [[${global.user != null ? global.user.photo: ''}]] : '';

      // 为选中的文本添加下划线样式
      const highlightComments = [[${vo.highlightComments}]];
      console.log('highlightComments:', highlightComments)
      if (highlightComments) {
        // 初始化文章的下划线样式
        initUnderlineToSelection(highlightComments);
      }

      function praiseFunc() {
          if (!isLogin) {
              // 未登录，不执行相关操作
              return;
          }

          praised = !praised;

          praiseArticle(articleId, praised, function (data) {
              let avatarList = $('#praiseUsers')
              if (praised) {
                  // 点赞
                  praisedCount += 1;
                  $("#praiseFloatBtn, #praiseBtn, #praiseFloatBtnMd").addClass("active")

                  // 添加当前点赞用户的头像
                  avatarList.prepend('' +
                      '            <a class="g-user-popover approval-img" href="/user/' + currentUserId + '">\n' +
                      '                <img src="' + currentUserAvatar + '" width="25" height="25">\n' +
                      '            </a>')
              } else {
                  // 取消点赞
                  praisedCount -= 1;
                  $("#praiseFloatBtn, #praiseBtn, #praiseFloatBtnMd").removeClass("active")

                  // 移除当前点赞用户的头像
                  let subItems = avatarList.children();
                  for (let i = 0; i < subItems.length; i++) {
                      let target = subItems[i];
                      if (target.innerHTML.indexOf(currentUserAvatar) >= 0) {
                          // 移除当前用户头像
                          target.remove();
                          break;
                      }
                  }
              }


              if (praisedCount > 0) {
                  $("#praiseFloatBtn, #praiseFloatBtnMd").addClass("with-badge")
                  $('#praiseFloatBtn, #praiseFloatBtnMd').attr("badge", praisedCount)
                  $('#praiseDesc').text(String(praisedCount) + '人已点赞');

              } else {
                  $("#praiseFloatBtn, #praiseFloatBtnMd").removeClass("with-badge")
                  $('#praiseFloatBtn, #praiseFloatBtnMd').removeAttr("badge")
                  $('#praiseDesc').text('真诚点赞，诚不我欺');
              }
          });
      }

      // 点赞
      $("#praiseFloatBtn, #praiseBtn, #praiseFloatBtnMd").on('click', function () {
          praiseFunc();
      });

      // 收藏
      let collectionCount = [[${vo.article.count.collectionCount}]]
      let collected = [[${vo.article.collected}]]

      $("#collectFloatBtn, #collectFloatBtnMd").click(function () {
          if (!isLogin) {
              // 未登录，不执行相关操作
              return;
          }

          collected = !collected;
          const curDom = $(this)
          collectArticle(articleId, collected, function (data) {
              if (collected) {
                  // 点赞
                  collectionCount += 1;
                  curDom.addClass("active")
              } else {
                  collectionCount -= 1;
                  curDom.removeClass("active")
              }

              if (collectionCount > 0) {
                  curDom.addClass("with-badge")
                  curDom.attr("badge", collectionCount)
              } else {
                  curDom.removeClass("with-badge")
                  curDom.removeAttr("badge")
              }
          });
      })


      // 加载推荐列表
      let params = {
          "articleId": articleId,
          "page": 1
      }
      loadMore("#articleList", "/article/api/recommend", params, "articleList", function() {
        if($('#articleList:has(div)').length == 0) {
          // 不存在推荐内容
          $("#relatedRecommend").hide();
        }
      });

      // 回到顶端
      $.scrollUp({
          animation: 'fade',
          activeOverlay: '#00FFFF',
          scrollImg: {
              active: true,
              type: 'background',
              src: '/img/top.png'
          }
      });

      function scrollToLatestTopComment(commentContent) {
        const trimmedContent = commentContent ? commentContent.trim() : ""
        const commentItems = document.querySelectorAll("#commentDiv .all-comment-items .all-comment-item .comment-item-wrap")
        let targetComment = null

        if (trimmedContent) {
          targetComment = Array.from(commentItems).find(function (item) {
            const contentNode = item.querySelector(".common-item-content-value")
            return contentNode && contentNode.innerText && contentNode.innerText.trim().indexOf(trimmedContent) >= 0
          })
        }

        if (!targetComment) {
          targetComment = document.querySelector("#commentDiv .all-comment-items .all-comment-item:first-child .comment-item-wrap")
        }

        if (!targetComment) {
          targetComment = document.getElementById("commentList")
        }

        if (targetComment && typeof targetComment.scrollIntoView === "function") {
          targetComment.scrollIntoView({ behavior: "smooth", block: "center" })
        }
      }

      function getTrimmedCommentValue(value) {
        return $.trim(value || "")
      }

      function syncMainCommentButtonState() {
        const commentBtn = $("#commentBtn")
        if (!commentBtn.length) {
          return
        }
        const hasContent = getTrimmedCommentValue($("#commentContent").val()).length > 0
        commentBtn.prop("disabled", !hasContent).toggleClass("c-btn-disabled", !hasContent)
      }

      function syncReplyButtonState(currentDom) {
        const replyBtn = currentDom.siblings(".hf-pl")
        if (!replyBtn.length) {
          return
        }
        const hasContent = getTrimmedCommentValue(currentDom.val()).length > 0
        replyBtn.prop("disabled", !hasContent).toggleClass("hf-pl--disabled", !hasContent)
      }

      function toggleMainCommentButton(currentDom, submitting) {
        if (!currentDom.length) {
          return
        }
        if (submitting) {
          currentDom.prop("disabled", true).addClass("c-btn-disabled")
          return
        }
        const hasContent = getTrimmedCommentValue($("#commentContent").val()).length > 0
        currentDom.prop("disabled", !hasContent).toggleClass("c-btn-disabled", !hasContent)
      }

      function toggleReplyButton(currentDom, submitting) {
        if (!currentDom.length) {
          return
        }
        if (submitting) {
          currentDom.prop("disabled", true).addClass("hf-pl--disabled")
          return
        }
        const hasContent = getTrimmedCommentValue(currentDom.siblings(".hf-input").val()).length > 0
        currentDom.prop("disabled", !hasContent).toggleClass("hf-pl--disabled", !hasContent)
      }

      function submitCommentRequest(params, onSuccess, onComplete) {
        $.ajax({
          method: "POST",
          url: "/comment/api/post",
          contentType: "application/json",
          data: JSON.stringify(params),
          success: function (data) {
            if (!data || !data.status || data.status.code !== 0) {
              toastr.error(data && data.status ? data.status.msg : "评论失败")
              return
            }
            if (onSuccess) {
              onSuccess(data.result)
            }
          },
          error: function () {
            toastr.error("出现bug了，热心反馈下吧!")
          },
          complete: function () {
            if (onComplete) {
              onComplete()
            }
          },
        })
      }

      function refreshCommentList(content, callback) {
        document.getElementById("commentDiv").innerHTML = content
        if (typeof window.autoExpandSingleReplyWraps === "function") {
          window.autoExpandSingleReplyWraps(document.getElementById("commentDiv"))
        }
        syncMainCommentButtonState()
        if (callback) {
          callback()
        }
      }

      function bindCommentInputEvent() {
        $(document)
          .off("click.articleComment", "#commentBtn")
          .on("click.articleComment", "#commentBtn", function () {
            const currentDom = $(this)
            const submittedContent = getTrimmedCommentValue($("#commentContent").val())
            if (!submittedContent || submittedContent.length > 512) {
              toastr.error("评论内容长度要求在[1,512]之间")
              syncMainCommentButtonState()
              return
            }

            toggleMainCommentButton(currentDom, true)
            submitCommentRequest({
              articleId: articleId,
              commentContent: submittedContent,
            }, function (data) {
              commented = true
              commentCount += 1
              syncCommentFloatBtn()
              refreshCommentList(data, function () {
                window.requestAnimationFrame(function () {
                  scrollToLatestTopComment(submittedContent)
                })
              })
            }, function () {
              if ($.contains(document, currentDom[0])) {
                toggleMainCommentButton(currentDom, false)
              }
            })
          })
          .off("input.articleComment propertychange.articleComment", "#commentContent")
          .on("input.articleComment propertychange.articleComment", "#commentContent", function () {
            syncMainCommentButtonState()
          })
          .off("click.articleComment", ".reply-comment")
          .on("click.articleComment", ".reply-comment", function () {
            const currentDom = $(this)
            if (currentDom.attr("data-toggle") === "modal") {
              return
            }
            createComment(currentDom)
          })
          .off("click.articleComment", ".hf-pl")
          .on("click.articleComment", ".hf-pl", function () {
            commentSubmit($(this))
          })
          .off("input.articleComment propertychange.articleComment", ".hf-input")
          .on("input.articleComment propertychange.articleComment", ".hf-input", function () {
            syncReplyButtonState($(this))
          })
      }

      const createComment = function (currentDom) {
        $(".hf-con").remove()

        var fhName = currentDom.attr("data-reply-nickname") ||
                currentDom
                        .parents(".common-item-content")
                        .find(".comment-name")
                        .first()
                        .text()
        fhName = fhName ? fhName.trim() : ""
        var fhN = "回复@" + fhName + "："
        var fhHtml =
                '<div class="hf-con pull-left"><textarea class="hf-input" placeholder="" "></textarea><button disabled class="hf-pl hf-pl--disabled">评论</button></div>'
        if (currentDom.is(".hf-con-block")) {
          const currentWrap =
                  (currentDom.parents(".comment-item-wrap").length &&
                          currentDom.parents(".comment-item-wrap")) ||
                  (currentDom.parents(".comment-item-wrap-second").length &&
                          currentDom.parents(".comment-item-wrap-second"))

          currentWrap.find(".common-item-content").append(fhHtml)
          currentDom.removeClass("hf-con-block")
          currentDom
                  .parents(".common-item-content")
                  .find(".hf-input")
                  .val("")
                  .focus()
                  .attr("placeholder", fhN)
          currentDom.find(".reply-comment-text").hide()
          currentDom.find(".reply-comment-text-none").show()
          return
        }

        currentDom.addClass("hf-con-block")
        currentDom.parents(".common-item-content").find(".pull-left").remove()
        currentDom.find(".reply-comment-text").show()
        currentDom.find(".reply-comment-text-none").hide()
      }

      const commentSubmit = function (currentDom) {
        const replyContent = currentDom.siblings(".hf-input")
        const replyBtn = currentDom
                .parents(".common-item-content")
                .find(".reply-comment")
        const submittedContent = getTrimmedCommentValue(replyContent.val())

        if (!submittedContent) {
          toastr.error("回复内容不能为空")
          syncReplyButtonState(replyContent)
          return
        }

        toggleReplyButton(currentDom, true)
        submitCommentRequest({
          articleId: $("#postsTitle").attr("data-id"),
          commentContent: submittedContent,
          parentCommentId: replyBtn.attr("data-reply-id"),
          topCommentId: replyBtn.attr("data-reply-top"),
        }, function (data) {
          commented = true
          commentCount += 1
          syncCommentFloatBtn()
          if (replyBtn.attr("data-reply-top")) {
            showQuoteCommentWithComments(replyBtn.attr("data-reply-top"))
          }

          const currentWrap = currentDom.closest(".expand-replies-wrap").length
            ? currentDom.closest(".expand-replies-wrap")
            : currentDom.closest(".comment-item-wrap").next(".expand-replies-wrap")
          const topCommentId = replyBtn.attr("data-reply-top")

          if (currentWrap.length && topCommentId && typeof refreshExpandedSubComments === "function") {
            currentDom.closest(".hf-con").remove()
            refreshExpandedSubComments(currentWrap, topCommentId, function (success) {
              if (success && typeof highlightLatestSubComment === "function") {
                highlightLatestSubComment(currentWrap)
              }
            })
            return
          }

          refreshCommentList(data)
        }, function () {
          if ($.contains(document, currentDom[0])) {
            toggleReplyButton(currentDom, false)
          }
        })
      }

      bindCommentInputEvent()
      syncMainCommentButtonState()

      function copyAndClose() {
        // 复制短链
        copyShortUrl();
        // // 关闭弹窗，有个问题，关闭之后无法再次打开；先不关闭
        // $('#shareModal').hide();
      }
      /*]]>*/
    </script>
  </body>
</html>
